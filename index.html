<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" class="rel href">
</head>
<body>
    <div class="start" id="main">
        <div class="part" id="display"></div>
        <button class="part" id="clear"><h1>C</h1></button>
        <button class="part" id="percentage"><h1>%</h1></button>
        <button class="part" id="divide"><h1>/</h1></button>
        <button class="part" id="seven"><h1>7</h1></button>
        <button class="part" id="eight"><h1>8</h1></button>
        <button class="part" id="nine"><h1>9</h1></button>
        <button class="part" id="multiply"><h1>*</h1></button>
        <button class="part" id="four"><h1>4</h1></button>
        <button class="part" id="five"><h1>5</h1></button>
        <button class="part" id="six"><h1>6</h1></button>
        <button class="part" id="substract"><h1>−</h1></button>
        <button class="part" id="one"><h1>1</h1></button>
        <button class="part" id="two"><h1>2</h1></button>
        <button class="part" id="three"><h1>3</h1></button>
        <button class="part" id="plus"><h1>+</h1></button>
        <button class="part" id="zero"><h1>0</h1></button>
        <button class="part" id="dot"><h1>.</h1></button>
        <button class="part" id="equal"><h1>=</h1></button>
    </div>
    <script src="script.js"></script>
</body>
</html>
